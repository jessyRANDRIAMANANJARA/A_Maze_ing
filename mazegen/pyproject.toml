[build-system]
requires = ["setuptools>=61", "wheel>=0.36"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generation and solving"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.4.1"]

[tool.setuptools]
packages = ["mazegen"]
package-dir = { "mazegen" = "." }

[tool.setuptools.package-data]
mazegen = ["README.md"]
